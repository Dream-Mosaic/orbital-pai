# Local DEV infra only — run the APP natively (./dev.sh) and let this provide the backing
# services it expects on the host. This is NOT the deploy config: production runs the app +
# Qdrant together via docker-compose.yml (Coolify). Keep the two files separate.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d      # start dev deps (Qdrant)
#   ./dev.sh                                             # run the app natively on :8787
#   docker compose -f docker-compose.dev.yml down        # stop (data persists in the volume)
#
# Qdrant here is UNAUTHENTICATED and its HTTP port is published to the host, so the native
# mix server reaches it at http://localhost:6333 (the dev default; no QDRANT_URL/QDRANT_API_KEY
# needed in .env). Production Qdrant uses an API key and publishes no host port — this dev one
# intentionally does neither.
name: personal-assistant-dev   # separate Compose project — never collides with the prod stack's containers

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2        # pinned to match production
    restart: unless-stopped
    ports:
      - "6333:6333"                     # HTTP REST — exposed to the host for the native dev server
    volumes:
      - qdrant-dev-data:/qdrant/storage

volumes:
  qdrant-dev-data:
