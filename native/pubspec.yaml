name: henry_wall
description: "Henry native wall client (Milestone 1a spike + skeleton)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  stream_channel: ^2.1.2
  record: ^5.1.2
  porcupine_flutter: ^3.0.3
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  url_launcher_platform_interface: ^2.3.2

# record 5.2.1's own constraint (`record_linux: '>=0.5.0 <1.0.0'`) resolves to
# record_linux 0.7.2, which predates several record_platform_interface
# additions (startStream, hasPermission's `request` param) it never
# implemented — a real upstream staleness bug in the desktop-only Linux
# backend. It breaks `flutter build apk` (not just Linux builds) because
# record's io-platform selection file imports all four native backends
# unconditionally and Dart type-checks the whole reachable graph regardless
# of target platform. We don't ship Linux, so pin the newer record_linux
# 1.3.1, which does implement the interface record resolves to (1.6.0).
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  # The exact families the web self-hosts (server/priv/static/fonts/*.woff2),
  # converted woff2 -> ttf. Both are VARIABLE (Space Grotesk wght 300-700, Inter
  # 100-900), so CSS weights like 650 are reachable exactly via fontVariations
  # instead of rounding to the nearest FontWeight.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
